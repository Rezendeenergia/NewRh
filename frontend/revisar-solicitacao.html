<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar Solicitação — Rezende Energia</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--fundo);
      font-family: var(--f-texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: var(--sup);
      border: 1px solid var(--ov-80);
      border-top: 3px solid var(--laranja);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      overflow: hidden;
    }
    .card__header {
      background: linear-gradient(135deg, var(--sup-2), var(--sup));
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--ov-60);
      text-align: center;
    }
    .brand { font-size: 22px; font-weight: 900; color: var(--texto); }
    .brand span { color: var(--laranja-texto); }
    .subtitle { font-size: 11px; color: var(--ov-350); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
    .card__body { padding: 32px; }
    h2 { font-size: 20px; font-weight: 800; color: var(--texto); margin-bottom: 4px; }
    .section-title { font-size: 11px; color: rgba(255,106,0,.8); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
    .info-block {
      background: rgba(255,106,0,.06);
      border: 1px solid rgba(255,106,0,.18);
      border-left: 3px solid var(--laranja);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .info-block__label { font-size: 10px; color: var(--laranja-texto); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
    .info-block__value { font-size: 16px; font-weight: 800; color: var(--texto); }
    .info-block__sub { font-size: 13px; color: var(--texto-2); margin-top: 3px; }
    .table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-bottom: 24px; }
    .table td { padding: 10px 14px; font-size: 14px; border-radius: 8px; }
    .table .lbl { background: var(--ov-30); border: 1px solid var(--ov-60); color: rgba(255,106,0,.8); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; width: 38%; }
    .table .val { background: var(--ov-20); border: 1px solid var(--ov-40); color: var(--texto); }
    .divider { border: none; border-top: 1px solid var(--ov-60); margin: 24px 0; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid;
      transition: opacity .2s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn--approve { background: var(--ok-fundo); border-color: var(--ok); color: var(--ok); }
    .btn--reject  { background: var(--alerta-fundo); border-color: var(--alerta); color: var(--alerta); }
    .btn--approve:hover:not(:disabled) { background: var(--ok-fundo); }
    .btn--reject:hover:not(:disabled)  { background: var(--alerta-fundo); }
    .motivo-wrap { margin-top: 16px; display: none; }
    .motivo-wrap label { font-size: 13px; color: var(--texto-2); display: block; margin-bottom: 6px; }
    .motivo-wrap textarea {
      width: 100%;
      background: var(--sup-2);
      border: 1px solid var(--ov-120);
      border-radius: 8px;
      color: var(--texto);
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      min-height: 80px;
      outline: none;
    }
    .btn--confirm {
      margin-top: 10px;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--rz-laranja-400), var(--laranja), var(--rz-laranja-600));
      color:var(--sobre-laranja);
    }
    .btn--confirm:disabled { opacity: .5; cursor: not-allowed; }
    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
    .alert--success { background: var(--ok-fundo); border: 1px solid var(--ok); color: var(--ok); }
    .alert--error   { background: var(--alerta-fundo); border: 1px solid var(--alerta); color: var(--alerta); }
    .loading { text-align: center; color: var(--texto-3); padding: 40px; }
    .card__footer { padding: 16px 32px; border-top: 1px solid var(--ov-60); text-align: center; }
    .card__footer p { font-size: 12px; color: var(--ov-200); line-height: 1.5; }
  </style>
  <script src="/js/rezende-tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/rezende-tema.css">
  <link rel="stylesheet" href="/css/rezende-newrh.css">
</head>
<body>
<button class="rz-tema-btn rz-tema-flutuante" type="button" data-rz-tema aria-label="Alternar modo claro/escuro" title="Modo claro/escuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
<div class="card">
  <div class="card__header">
    <div class="brand">⚡ Rezende <span>Energia</span></div>
    <div class="subtitle">Aprovação de Solicitação de Vaga</div>
  </div>
  <div class="card__body" id="content">
    <div class="loading">⏳ Carregando solicitação...</div>
  </div>
  <div class="card__footer">
    <p>Rezende Construção e Manutenção Ltda · Santarém, PA<br>
       Esta página é exclusiva para aprovação de vagas.</p>
  </div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const token  = params.get('token') || '';
  const contentEl = document.getElementById('content');

  if (!token) {
    contentEl.innerHTML = '<div class="alert alert--error" style="display:block">❌ Token inválido ou expirado.</div>';
    return;
  }

  // Busca dados da solicitação pelo token
  let sol = null;
  try {
    const resp = await fetch(`/api/solicitacoes/by-token?token=${encodeURIComponent(token)}`);
    if (!resp.ok) throw new Error('not found');
    sol = await resp.json();
  } catch {
    contentEl.innerHTML = '<div class="alert alert--error" style="display:block">❌ Solicitação não encontrada ou link expirado.</div>';
    return;
  }

  if (sol.status !== 'PENDENTE') {
    const cor = sol.status === 'APROVADA' ? 'var(--ok)' : 'var(--alerta)';
    const ico = sol.status === 'APROVADA' ? '✅' : '❌';
    contentEl.innerHTML = `
      <h2 style="text-align:center;margin-bottom:8px;">${ico} Já Decidida</h2>
      <p class="section-title" style="text-align:center;">Esta solicitação já foi processada</p>
      <div style="text-align:center;padding:16px;background:var(--ov-30);border-radius:12px;">
        <span style="color:${cor};font-size:18px;font-weight:800;">Situação: ${sol.status}</span>
      </div>`;
    return;
  }

  // Renderiza formulário
  contentEl.innerHTML = `
    <h2>Solicitação de Vaga</h2>
    <p class="section-title">Analise os dados abaixo e tome uma decisão</p>

    <div class="info-block">
      <div class="info-block__label">Solicitante</div>
      <div class="info-block__value">${sol.solicitanteNome}</div>
      <div class="info-block__sub">✉️ ${sol.solicitanteEmail}</div>
    </div>

    <table class="table">
      <tr><td class="lbl">Cargo</td><td class="val">${sol.position}</td></tr>
      <tr><td class="lbl">Localização</td><td class="val">📍 ${sol.location}</td></tr>
      <tr><td class="lbl">Tipo</td><td class="val">${sol.tipo || '—'}</td></tr>
      <tr><td class="lbl">Nº de Vagas</td><td class="val">${sol.numVagas}</td></tr>
      ${sol.finalidade ? `<tr><td class="lbl">Finalidade</td><td class="val">${sol.finalidade}</td></tr>` : ''}
      <tr><td class="lbl">Justificativa</td><td class="val">${sol.justificativa}</td></tr>
    </table>

    <hr class="divider">
    <p style="font-size:13px;color:var(--texto-2);margin-bottom:16px;text-align:center;">
      Ao aprovar, a vaga será criada e publicada automaticamente no portal.
    </p>

    <div class="btn-group">
      <button class="btn btn--approve" id="btn-approve">✅ Aprovar</button>
      <button class="btn btn--reject"  id="btn-reject">❌ Rejeitar</button>
    </div>

    <div class="motivo-wrap" id="motivo-wrap">
      <label for="motivo-txt">Motivo da rejeição (será enviado ao gestor):</label>
      <textarea id="motivo-txt" placeholder="Descreva o motivo..."></textarea>
      <button class="btn--confirm" id="btn-confirm-reject">Confirmar Rejeição</button>
    </div>

    <div class="alert alert--success" id="alert-ok"></div>
    <div class="alert alert--error"   id="alert-err"></div>
  `;

  const btnApprove = document.getElementById('btn-approve');
  const btnReject  = document.getElementById('btn-reject');
  const motivoWrap = document.getElementById('motivo-wrap');
  const btnConfirm = document.getElementById('btn-confirm-reject');
  const alertOk    = document.getElementById('alert-ok');
  const alertErr   = document.getElementById('alert-err');

  async function decide(decision, motivo) {
    [btnApprove, btnReject, btnConfirm].forEach(b => b && (b.disabled = true));
    alertOk.style.display = 'none';
    alertErr.style.display = 'none';
    try {
      const r = await fetch(`/api/solicitacoes/revisar-portal?token=${encodeURIComponent(token)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision, motivo: motivo || '' }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.message || 'Erro');
      alertOk.textContent = decision === 'APROVADA'
        ? '✅ Vaga aprovada e publicada com sucesso!'
        : '❌ Solicitação rejeitada. O gestor foi notificado.';
      alertOk.style.display = 'block';
      [btnApprove, btnReject].forEach(b => b.style.display = 'none');
      motivoWrap.style.display = 'none';
    } catch (e) {
      alertErr.textContent = '❌ ' + e.message;
      alertErr.style.display = 'block';
      [btnApprove, btnReject, btnConfirm].forEach(b => b && (b.disabled = false));
    }
  }

  btnApprove.addEventListener('click', () => decide('APROVADA', null));

  btnReject.addEventListener('click', () => {
    motivoWrap.style.display = motivoWrap.style.display === 'block' ? 'none' : 'block';
  });

  btnConfirm.addEventListener('click', () => {
    const motivo = document.getElementById('motivo-txt').value.trim();
    decide('REJEITADA', motivo);
  });
})();
</script>
</body>
</html>
