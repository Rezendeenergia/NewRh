<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Criar Senha — Portal de Carreiras Rezende Energia</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <script src="/js/rezende-tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/rezende-tema.css">
  <link rel="stylesheet" href="/css/rezende-newrh.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background:var(--void); display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .box { background:var(--surface); border:1px solid var(--ov-70); border-radius:20px;
           padding:40px 36px; width:100%; max-width:380px; box-shadow:0 32px 80px var(--bk-60); }
  </style>
</head>
<body>
<button class="rz-tema-btn rz-tema-flutuante" type="button" data-rz-tema aria-label="Alternar modo claro/escuro" title="Modo claro/escuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
<div class="box">
  <div style="text-align:center;margin-bottom:28px;">
    <img class="logo-claro" src="/img/logo-rezende.png" alt="Rezende Energia" style="height:52px;margin-bottom:12px;"><img class="logo-escuro" src="/img/logo-rezende-branca.png" alt="Rezende Energia" style="height:52px;margin-bottom:12px;">
    <h2 style="font-size:1.3rem;font-weight:800;color:var(--texto);margin:0 0 6px;">Criar Senha</h2>
    <p style="color:var(--ink-3);font-size:.85rem;margin:0;">Portal de Carreiras — Rezende Energia</p>
  </div>

  <div id="form-area">
    <div class="form-field">
      <label class="form-field__label">Nova senha</label>
      <input id="senha1" type="password" class="form-field__input" placeholder="Mínimo 6 caracteres"
             onkeydown="if(event.key==='Enter')document.getElementById('senha2').focus()">
    </div>
    <div class="form-field">
      <label class="form-field__label">Confirmar senha</label>
      <input id="senha2" type="password" class="form-field__input" placeholder="Repita a senha"
             onkeydown="if(event.key==='Enter')definir()">
    </div>
    <div id="alert" class="alert" style="display:none;margin-bottom:12px;"></div>
    <button id="btn" onclick="definir()" class="btn btn--primary btn--full btn--large">
      Criar Senha
    </button>
  </div>

  <div id="sucesso" style="display:none;text-align:center;padding:20px 0;">
    <div style="font-size:3rem;margin-bottom:12px;">✅</div>
    <p style="color:var(--ok);font-weight:700;font-size:16px;margin:0 0 8px;">Senha criada com sucesso!</p>
    <p style="color:var(--ink-3);font-size:13px;margin:0 0 20px;">Você já pode acessar o portal.</p>
    <a href="/" class="btn btn--primary">← Ir para o Portal</a>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('form-area').innerHTML =
    '<p style="color:var(--alerta);text-align:center;">Link inválido. Solicite um novo link de acesso.</p>' +
    '<a href="/" class="btn btn--ghost btn--full" style="margin-top:16px;">← Voltar ao Portal</a>';
}

async function definir() {
  const senha1  = document.getElementById('senha1').value;
  const senha2  = document.getElementById('senha2').value;
  const alertEl = document.getElementById('alert');
  const btn     = document.getElementById('btn');

  if (!senha1 || !senha2) {
    alertEl.textContent = '❌ Preencha os dois campos.';
    alertEl.style.display = 'block'; return;
  }
  if (senha1.length < 6) {
    alertEl.textContent = '❌ A senha deve ter pelo menos 6 caracteres.';
    alertEl.style.display = 'block'; return;
  }
  if (senha1 !== senha2) {
    alertEl.textContent = '❌ As senhas não conferem.';
    alertEl.style.display = 'block'; return;
  }

  alertEl.style.display = 'none';
  btn.textContent = 'Salvando...'; btn.disabled = true;

  try {
    const r = await fetch('/api/candidato/definir-senha', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, senha: senha1 }),
    });
    const d = await r.json();
    if (!r.ok) {
      alertEl.textContent = '❌ ' + (d.message || 'Erro');
      alertEl.style.display = 'block';
      btn.textContent = 'Criar Senha'; btn.disabled = false;
      return;
    }
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('sucesso').style.display   = 'block';
  } catch(e) {
    alertEl.textContent = '❌ Erro de conexão.';
    alertEl.style.display = 'block';
    btn.textContent = 'Criar Senha'; btn.disabled = false;
  }
}
</script>
</body>
</html>
