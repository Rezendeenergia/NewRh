<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Candidaturas CIPA — Rezende Energia</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <script src="/js/rezende-tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/rezende-tema.css">
  <link rel="stylesheet" href="/css/rezende-newrh.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background:var(--void); color:var(--ink-1); font-family:var(--f-texto); margin:0; }

    .page-header {
      background:var(--surface);
      border-bottom:1px solid var(--ov-60);
      padding:16px 32px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      flex-wrap: wrap;
    }
    .page-header__brand { display:flex; align-items:center; gap:12px; }
    .page-header__brand img { height:32px; }
    .page-header__title { font-family:var(--f-titulo); font-weight:900; font-size:1.1rem; color:var(--texto); }
    .page-header__sub { font-size:.75rem; color:var(--ink-3); }
    .page-header__nav { display:flex; gap:8px; align-items:center; }
    .page-header__nav a {
      padding:7px 16px; border-radius:8px; font-size:.83rem; font-weight:500;
      text-decoration:none; color:var(--ink-2); transition:all .15s;
    }
    .page-header__nav a:hover { background:var(--ov-60); color:var(--texto); }
    .page-header__nav a.active { background:rgba(255,106,0,.12); color:var(--brand); }

    .page-body { padding:28px 32px; max-width:1200px; margin:0 auto; }

    .stats-row { display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
    .stat-card {
      background:var(--surface); border:1px solid var(--ov-60);
      border-radius:16px; padding:20px 24px; flex:1; min-width:160px;
    }
    .stat-card__n { font-family:var(--f-titulo); font-size:2rem; font-weight:900; color:var(--brand); }
    .stat-card__l { font-size:.75rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }

    .filters-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .filters-bar input {
      background:var(--surface); border:1px solid var(--ov-80);
      color:var(--ink-1); border-radius:8px; padding:8px 12px; font-size:.83rem;
      font-family:var(--f-texto); outline:none; flex:1; min-width:220px;
    }
    .filters-bar input::placeholder { color:var(--ink-3); }

    .table-wrap { background:var(--surface); border:1px solid var(--ov-60); border-radius:16px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead th {
      padding:12px 16px; font-size:.72rem; font-weight:600; color:var(--ink-3);
      text-transform:uppercase; letter-spacing:.06em;
      border-bottom:1px solid var(--ov-60); text-align:left;
      background:var(--ov-20);
    }
    tbody tr { border-bottom:1px solid var(--ov-40); }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--ov-30); }
    tbody td { padding:14px 16px; font-size:.85rem; vertical-align:top; }

    .td-name { font-weight:600; color:var(--texto); }
    .td-sub  { font-size:.75rem; color:var(--ink-3); margin-top:2px; }
    .td-motivo { max-width:420px; white-space:pre-wrap; color:var(--ink-2); }

    .loading { padding:32px; text-align:center; color:var(--ink-3); }
  </style>
</head>
<body>

<div id="app-screen">

  <div class="page-header">
    <div class="page-header__brand">
      <img class="logo-claro" src="/img/logo-rezende.png" alt="Rezende Energia"><img class="logo-escuro" src="/img/logo-rezende-branca.png" alt="Rezende Energia">
      <div>
        <div class="page-header__title">Rezende RH</div>
        <div class="page-header__sub">Candidaturas à CIPA — Gestão 2027</div>
      </div>
    </div>
    <div class="page-header__nav">
      <a href="/admissao">🏢 Fluxo de Admissão</a>
      <a href="/admissoes">🏗 Admissões</a>
      <a href="/?gestor=1" style="margin-left:8px;">← Menu inicial</a>
      <button class="rz-tema-btn" type="button" data-rz-tema aria-label="Alternar modo claro/escuro" title="Modo claro/escuro"><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
    </div>
  </div>

  <div class="page-body">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card__n" id="st-total">—</div>
        <div class="stat-card__l">Candidaturas recebidas</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" id="f-search" placeholder="🔍 Buscar por nome, matrícula ou cargo..." oninput="renderTable()">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Matrícula</th>
            <th>Cargo</th>
            <th>Por que quer participar</th>
            <th>Recebido em</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" class="loading">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="js/rz-sessao.js"></script>
<script>
const API = '/api';
let token = (window.RzSessao && RzSessao.ler() || {}).token || '';
let candidaturas = [];

async function loadData() {
  try {
    const r = await fetch(`${API}/cipa`, { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 401) { RzSessao.expirou(); return; }
    candidaturas = await r.json();
    document.getElementById('st-total').textContent = candidaturas.length;
    renderTable();
  } catch (e) {
    console.error(e);
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="5" class="loading">Erro ao carregar dados</td></tr>';
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTable() {
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  let itens = candidaturas;
  if (q) {
    itens = itens.filter(c =>
      (c.nome || '').toLowerCase().includes(q) ||
      (c.matricula || '').toLowerCase().includes(q) ||
      (c.cargo || '').toLowerCase().includes(q)
    );
  }
  const tbody = document.getElementById('table-body');
  if (!itens.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="loading">Nenhuma candidatura encontrada.</td></tr>';
    return;
  }
  tbody.innerHTML = itens.map(c => `
    <tr>
      <td class="td-name">${esc(c.nome)}</td>
      <td>${esc(c.matricula)}</td>
      <td>${esc(c.cargo)}</td>
      <td class="td-motivo">${esc(c.motivo)}</td>
      <td class="td-sub">${c.createdAt ? new Date(c.createdAt).toLocaleString('pt-BR', { timeZone: 'America/Santarem' }) : '—'}</td>
    </tr>
  `).join('');
}

loadData();
</script>

</body>
</html>
